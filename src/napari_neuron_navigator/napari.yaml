name: napari-neuron-navigator
display_name: Neuron Navigator
contributions:
  commands:
    - id: napari-neuron-navigator.get_reader
      python_name: napari_neuron_navigator._reader:napari_get_reader
      title: Open SWC, Parquet, or NRRD file
    - id: napari-neuron-navigator.neuron_viewer
      python_name: napari_neuron_navigator.widgets:NeuronViewerWidget
      title: Neuron Viewer

  readers:
    - command: napari-neuron-navigator.get_reader
      accepts_directories: false
      filename_patterns:
        - "*.swc"
        - "*.parquet"
        - "*.nrrd"

  widgets:
    - command: napari-neuron-navigator.neuron_viewer
      display_name: Neuron Viewer
