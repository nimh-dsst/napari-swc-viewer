[workspace]
name = "napari-swc-viewer"
version = "0.1.0"
description = "A napari plugin for viewing SWC files"
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tasks]
test = "pytest -v"
test-cov = "pytest -v --cov=napari_swc_viewer --cov-report=xml"
build = "pip install -e ."
napari = { cmd = "napari", depends-on = ["build"] }
download-cpd2 = "python scripts/download_cpd2.py"
download-test-data = "python scripts/download_test_data.py"

[dependencies]
python = ">=3.10,<3.13"
napari = ">=0.5.0"
numpy = ">=1.24"
brainglobe-atlasapi = ">=2.0"
scipy = ">=1.10"
seaborn = ">=0.13"
matplotlib = ">=3.7"
duckdb = ">=0.9"
pyarrow = ">=14.0"
pandas = ">=2.0"
xlsxwriter = ">=3.2"
pytest = ">=7.0"
pytest-cov = ">=4.0"
pip = ">=23.0"
setuptools-scm = ">=8.0"
pyqt6 = ">=6.8.1,<7"
pyqtgraph = ">=0.13"
pynrrd = ">=1.0"
openpyxl = ">=3.1"

[target.linux-64.dependencies]
# Linux needs mesa for headless OpenGL
mesalib = ">=21.0"

[feature.dev.dependencies]
pre-commit = ">=3.0"
ruff = ">=0.1"

[feature.docs.dependencies]
weasyprint = "*"
pygments = "*"
markdown-it-py = ">=4.2.0,<5"

[feature.docs.tasks]
cpd2-pdf = { cmd = "python scripts/markdown_to_pdf.py docs/cpd2_workflow.md docs/_build/cpd2_workflow.pdf", default-environment = "docs" }

[environments]
default = ["dev"]
ci = { features = [], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
